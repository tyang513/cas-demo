spring.application.name=cas-client2
server.port=9092
server.context-path=/cas-client2
# cas 配置 SSO退出API
cas.client.serverName=http://localhost:9092/cas-client2
#http://172.48.108.43:8080
#cas.client.casServerUrlPrefix=http://demo.bing1tech.com/cas
cas.client.casServerUrlPrefix=https://account.bing1tech.com/cas
cas.client.casServerLoginUrl=${cas.client.casServerUrlPrefix}/login
cas.client.casServerLogoutUrl=${cas.client.casServerUrlPrefix}/logout
cas.client.security=http://localhost:9092/cas-client2/login/cas
# 日志配置
logging.path=./logs
#logging.pattern.file=
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}}
logging.level.root=info
logging.level.sun.rmi=info
logging.level.org.eclipse=info
logging.level.org.jasig=debug
